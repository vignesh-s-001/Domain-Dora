services:
  - type: web
    name: domain-dora-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # If you decide to add Redis caching later, you can add the URL here:
      # - key: REDIS_URL
      #   value: "redis://..."
